name: Mara Alpha One-Shot Deploy

on:
  push:
    branches:
      - web/mvp-owned-funnel
    paths:
      - ".github/workflows/mara-alpha-one-shot-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-alpha]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify existing Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required existing GitHub Secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Revalidate release candidate
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm install --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run build

      - name: Deploy exact branch snapshot to Vercel production
        id: deploy
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log
          deployment_url=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "::error::Vercel CLI did not expose a deployment URL."
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "MARA_DEPLOY_URL=$deployment_url"

      - name: Wait for terminal Vercel state
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: npx --yes vercel@latest inspect "$DEPLOYMENT_URL" --wait --token "$VERCEL_TOKEN"

      - name: Verify public production surface
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          for path in / /experience /meet-mara /legal; do
            code=$(curl -L -sS -o /tmp/mara-page.html -w '%{http_code}' "$DEPLOYMENT_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done

          for path in \
            /experience/caprichos-lab \
            /experience/commerce-lab \
            /experience/economics-lab \
            /experience/media-companion-lab \
            /experience/orchestration-lab \
            /experience/rituals-lab \
            /experience/segment-lab \
            /experience/wtp-lab; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' "$DEPLOYMENT_URL$path")
            echo "$path -> $code"
            test "$code" = "404"
          done

          safe_code=$(curl -sS -o /tmp/telemetry-safe.txt -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"event":"page_view","properties":{},"timestamp":"2026-09-03T00:00:00.000Z"}' \
            "$DEPLOYMENT_URL/api/telemetry")
          echo "/api/telemetry safe event -> $safe_code"
          test "$safe_code" = "200"

          rejected_code=$(curl -sS -o /tmp/telemetry-rejected.txt -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"event":"raw_intimate_text","properties":{"text":"should never be accepted"},"timestamp":"2026-09-03T00:00:00.000Z"}' \
            "$DEPLOYMENT_URL/api/telemetry")
          echo "/api/telemetry rejected event -> $rejected_code"
          test "$rejected_code" = "400"

          echo "MARA_PUBLIC_ALPHA_DEPLOY PASS"
          echo "VERIFIED_URL=$DEPLOYMENT_URL"
