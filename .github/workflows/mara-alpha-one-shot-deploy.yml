name: Mara Creator Alpha Canonical Cutover

on:
  push:
    branches:
      - web/mvp-owned-funnel
    paths:
      - ".github/workflows/mara-alpha-one-shot-deploy.yml"

permissions:
  contents: read

env:
  RELEASE_SHA: "0053e6254ade9c7b177acca89871e4fc29d04e5c"
  FROZEN_RC_SHA: "41ef4fb118e5a0d830ac1c400d10aa1f26f75fd4"
  VERCEL_CLI_VERSION: "59.11.1"
  PLAYWRIGHT_VERSION: "1.62.1"
  EXPECTED_VERCEL_ORG_ID: "team_KAPFjrSQT78GUeQyGZCdQRdz"
  EXPECTED_VERCEL_PROJECT_ID: "prj_47YN2RH1i1NvaRTuEVqqbA8cdxUK"
  CANONICAL_MARA_WEB_BLOB: "043bbb92f1ac6cc9b98ae7686e3ad5b1dceb8710"
  CANONICAL_URL: "https://mara-vera.vercel.app"
  STAGED_DEPLOYMENT_ID: "dpl_FjLFiMXFa4cSvRhxi4PwyHsxf6iY"
  STAGED_DEPLOYMENT_URL: "https://mara-vera-is99e1po4-ignacioalfaz-6766.vercel.app"
  ROLLBACK_DEPLOYMENT_ID: "dpl_6EXB3HmQAFsofN7jW36AgdfNdgss"

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-alpha]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout exact merged Creator Alpha release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify exact release and canonical asset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -s public/mara/mara-v2-reference.webp
          test "$(git hash-object public/mara/mara-v2-reference.webp)" = "$CANONICAL_MARA_WEB_BLOB"
          node scripts/canonical-asset-integrity.mjs
          echo "MARA_RELEASE_SHA=$RELEASE_SHA"
          echo "MARA_FROZEN_RC_SHA=$FROZEN_RC_SHA"

      - name: Verify deployment credential presence
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release safety contract
        run: npm run release-safety:contract

      - name: Audit production dependencies
        run: node scripts/npm-audit-gate.mjs

      - name: Typecheck release
        run: npm run typecheck

      - name: Install pinned cutover tooling
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            "vercel@${VERCEL_CLI_VERSION}" \
            "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Link and verify canonical Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.EXPECTED_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.EXPECTED_VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          node <<'NODE'
          const fs=require('fs');
          const linked=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));
          if(linked.projectId!==process.env.EXPECTED_VERCEL_PROJECT_ID) throw new Error(`Wrong canonical project: ${linked.projectId}`);
          if(linked.orgId!==process.env.EXPECTED_VERCEL_ORG_ID) throw new Error(`Wrong Vercel org: ${linked.orgId}`);
          console.log('MARA_CANONICAL_PROJECT_LINK PASS');
          NODE

      - name: Verify safe canonical Production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.EXPECTED_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.EXPECTED_VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('.vercel/.env.production.local','utf8');
          const map=new Map();
          for(const line of text.split(/\r?\n/)) {
            const m=line.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
            if(!m) continue;
            let value=m[2].trim();
            if((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'"))) value=value.slice(1,-1);
            map.set(m[1], value);
          }
          for(const key of ['NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY','MARA_ALPHA_CREATOR_ONBOARDING_ENABLED','MARA_RELEASE_SHA','NEXT_PUBLIC_SITE_URL','SUPABASE_SECRET_KEY']) {
            if(!map.has(key)) throw new Error(`Missing canonical Production variable: ${key}`);
          }
          for(const key of ['MARA_QA_PROOF_TOKEN','MARA_SIGNED_TEST_PROOF','MARA_PAYMENT_PROVIDER','MARA_PAYMENT_WEBHOOK_SECRET']) {
            if(map.has(key)) throw new Error(`Forbidden proof/payment test variable present: ${key}`);
          }
          if(map.get('MARA_ALPHA_CREATOR_ONBOARDING_ENABLED')!=='true') throw new Error('Creator Alpha onboarding is not enabled');
          if(map.get('MARA_RELEASE_SHA')!==process.env.RELEASE_SHA) throw new Error('Release SHA env mismatch');
          console.log('MARA_CANONICAL_PRODUCTION_ENV PASS');
          console.log('MARA_REAL_MONEY OFF');
          console.log('MARA_PROOF_FLAGS ABSENT');
          NODE

      - name: Verify staged deployment identity and READY state
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$STAGED_DEPLOYMENT_ID?teamId=$EXPECTED_VERCEL_ORG_ID" \
            > /tmp/staged-deployment.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/staged-deployment.json','utf8'));
          if(d.id!==process.env.STAGED_DEPLOYMENT_ID) throw new Error(`Staged deployment id mismatch: ${d.id}`);
          if(d.meta?.githubCommitSha!==process.env.RELEASE_SHA) throw new Error(`Staged release SHA mismatch: ${d.meta?.githubCommitSha}`);
          if((d.readyState??d.state)!=='READY') throw new Error(`Staged deployment is not READY: ${d.readyState??d.state}`);
          if(d.target!=='production') throw new Error(`Staged deployment target mismatch: ${d.target}`);
          const projectId=d.projectId??d.project?.id;
          if(projectId && projectId!==process.env.EXPECTED_VERCEL_PROJECT_ID) throw new Error(`Staged project mismatch: ${projectId}`);
          console.log('MARA_STAGED_DEPLOYMENT_IDENTITY PASS');
          NODE

      - name: Verify staged health and payment boundary with authenticated Vercel curl
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.EXPECTED_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.EXPECTED_VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx vercel curl /api/health --deployment "$STAGED_DEPLOYMENT_URL" -- --silent --show-error > /tmp/health.json
          npx vercel curl /api/commerce/launch --deployment "$STAGED_DEPLOYMENT_URL" -- --silent --show-error > /tmp/commerce.json
          node <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const commerce=JSON.parse(fs.readFileSync('/tmp/commerce.json','utf8'));
          if(health.status!=='ok'||health.service!=='mara-vera-web'||health.commit!==process.env.RELEASE_SHA) throw new Error(`Health/release mismatch: ${JSON.stringify(health)}`);
          if(commerce.backendConfigured!==true) throw new Error('Canonical backend is not configured');
          if(commerce.payment?.status!=='not_configured'||commerce.payment?.provider!=='disabled') throw new Error(`Real-money boundary failed: ${JSON.stringify(commerce.payment)}`);
          console.log('MARA_STAGED_HEALTH PASS');
          console.log('MARA_PAYMENT_BOUNDARY PASS');
          NODE

      - name: Promote verified staged deployment to canonical Production
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.EXPECTED_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.EXPECTED_VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx vercel promote "$STAGED_DEPLOYMENT_URL" --yes --timeout 5m --token "$VERCEL_TOKEN"
          echo "MARA_PROMOTION_REQUESTED PASS"

      - name: Verify canonical alias, health, backend and payment boundary
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/canonical-health.json -w '%{http_code}' "$CANONICAL_URL/api/health" || true)
            if [ "$code" = "200" ] && node -e 'const h=require("/tmp/canonical-health.json"); process.exit(h.status==="ok"&&h.service==="mara-vera-web"&&h.commit===process.env.RELEASE_SHA?0:1)' 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"
          curl -L --fail --silent --show-error "$CANONICAL_URL/api/commerce/launch" > /tmp/canonical-commerce.json
          node <<'NODE'
          const fs=require('fs');
          const commerce=JSON.parse(fs.readFileSync('/tmp/canonical-commerce.json','utf8'));
          if(commerce.backendConfigured!==true) throw new Error('Canonical backend is not configured after promotion');
          if(commerce.payment?.status!=='not_configured'||commerce.payment?.provider!=='disabled') throw new Error(`Canonical real-money boundary failed: ${JSON.stringify(commerce.payment)}`);
          console.log('MARA_CANONICAL_ALIAS PASS');
          console.log('MARA_CANONICAL_PAYMENT_BOUNDARY PASS');
          NODE

      - name: Smoke canonical production URL
        env:
          BASE_URL: ${{ env.CANONICAL_URL }}
        run: node scripts/launch-smoke.mjs

      - name: Publish production evidence
        shell: bash
        run: |
          echo "MARA_CREATOR_ALPHA_CANONICAL_CUTOVER PASS"
          echo "MERGED_RELEASE_SHA=$RELEASE_SHA"
          echo "FROZEN_RC_SHA=$FROZEN_RC_SHA"
          echo "STAGED_DEPLOYMENT_ID=$STAGED_DEPLOYMENT_ID"
          echo "CANONICAL_URL=$CANONICAL_URL"
          echo "REAL_MONEY=false"
          echo "CREATOR_PAYOUTS=false"

      - name: Roll back canonical Production on failed post-promotion gate
        if: failure() && steps.promote.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.EXPECTED_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.EXPECTED_VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Post-promotion gate failed; rolling canonical Production back to $ROLLBACK_DEPLOYMENT_ID"
          npx vercel rollback "$ROLLBACK_DEPLOYMENT_ID" --yes --token "$VERCEL_TOKEN"
          echo "MARA_CANONICAL_ROLLBACK REQUESTED"
