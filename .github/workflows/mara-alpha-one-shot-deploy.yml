name: Mara Alpha Supabase Credential Inspection

on:
  push:
    branches:
      - web/mvp-owned-funnel
    paths:
      - ".github/workflows/mara-alpha-one-shot-deploy.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[supabase-token-alpha]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Supabase management credential presence only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "MARA_SUPABASE_MANAGEMENT_SOURCE=SUPABASE_ACCESS_TOKEN"
          elif [ -n "$SUPABASE_TOKEN" ]; then
            echo "MARA_SUPABASE_MANAGEMENT_SOURCE=SUPABASE_TOKEN"
          else
            echo "MARA_SUPABASE_MANAGEMENT_SOURCE=missing"
          fi
