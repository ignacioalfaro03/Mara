name: Mara Alpha Production Rollback

on:
  push:
    branches:
      - web/mvp-owned-funnel
    paths:
      - ".github/workflows/mara-alpha-one-shot-deploy.yml"

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: "59.11.1"
  VERCEL_ORG_ID: "team_KAPFjrSQT78GUeQyGZCdQRdz"
  VERCEL_PROJECT_ID: "prj_47YN2RH1i1NvaRTuEVqqbA8cdxUK"
  ROLLBACK_URL: "https://mara-vera-oigt38glv-ignacioalfaz-6766.vercel.app"

jobs:
  rollback:
    if: contains(github.event.head_commit.message, '[rollback-alpha]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7.0.1

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: Install pinned Vercel CLI
        run: npm install --no-save --no-package-lock --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"

      - name: Link canonical Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Roll back canonical production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel rollback "$ROLLBACK_URL" --yes --token "$VERCEL_TOKEN"

      - name: Verify canonical health after rollback
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' https://mara-vera.vercel.app/api/health)
          test "$code" = "200"
          node -e 'const h=require("/tmp/health.json"); if(h.status!=="ok"||h.service!=="mara-vera-web") process.exit(1)'
          echo "MARA_PRODUCTION_ROLLBACK PASS"
