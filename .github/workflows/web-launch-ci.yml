name: Web Launch CI

on:
  pull_request:
    paths:
      - "web/**"
      - "docs/architecture/**"
      - ".github/workflows/web-launch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_MARA_WEB_BLOB: "043bbb92f1ac6cc9b98ae7686e3ad5b1dceb8710"

jobs:
  canonical-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
      - name: Validate founder-approved canonical image
        run: node web/scripts/canonical-asset-integrity.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify canonical Mara web asset
        shell: bash
        run: |
          set -euo pipefail
          test -s public/mara/mara-v2-reference.webp
          actual_blob=$(git hash-object public/mara/mara-v2-reference.webp)
          echo "Canonical Mara web blob: $actual_blob"
          if [ "$actual_blob" != "$CANONICAL_MARA_WEB_BLOB" ]; then
            echo "::error::Canonical Mara web asset changed. Expected $CANONICAL_MARA_WEB_BLOB, got $actual_blob"
            exit 1
          fi
          node scripts/canonical-asset-integrity.mjs
          echo "MARA_CANONICAL_ASSET PASS"

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify production audit gate classifier
        run: node scripts/npm-audit-gate.mjs --self-test

      - name: Audit production dependencies
        run: node scripts/npm-audit-gate.mjs

      - name: Verify Alpha signal report parser
        run: npm run alpha:report:selftest

      - name: Verify Real App Wiring contract
        run: npm run real-app-wiring:contract

      - name: Verify release safety boundary
        run: npm run release-safety:contract

      - name: Verify payment readiness boundary
        run: npm run payment-readiness:contract

      - name: Verify product realization security contract
        if: github.head_ref == 'codex/full-product-realization-v1'
        run: node scripts/product-realization-security-contract.mjs

      - name: Verify DEV labs are blocked in production
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do
            if ! grep -q 'process.env.NODE_ENV !== "development"' "$file" || ! grep -q 'notFound' "$file"; then
              echo "Unsafe production lab route: $file"
              failed=1
            fi
          done < <(find app/experience -type f -path '*-lab/page.tsx' | sort)
          test "$failed" -eq 0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Install Chromium smoke runtime
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Production mobile smoke
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          npm start > /tmp/mara-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null

          if [ "$PR_HEAD_REF" = "strategy/mara-revenue-os-foundation-v1" ]; then
            echo "MARA_SMOKE_PROFILE=revenue-os-foundation-v1"
            BASE_URL=http://127.0.0.1:3000 node scripts/revenue-os-foundation-smoke.mjs
          elif [ "$PR_HEAD_REF" = "codex/full-product-realization-v1" ]; then
            echo "MARA_SMOKE_PROFILE=full-product-realization-v1"
            BASE_URL=http://127.0.0.1:3000 node scripts/full-product-realization-smoke.mjs
          elif [ "$PR_HEAD_REF" = "design/platform-experience-reinvention-v1" ]; then
            echo "MARA_SMOKE_PROFILE=platform-reinvention-v1"
            node scripts/design-release-smoke.mjs
            BASE_URL=http://127.0.0.1:3000 node scripts/design-preview-proof.mjs
          else
            echo "MARA_SMOKE_PROFILE=legacy-public-alpha"
            node scripts/launch-smoke.mjs
            node scripts/continuity-cta-smoke.mjs
            node scripts/world-sofi-smoke.mjs
            node scripts/launch-loop-smoke.mjs
            node scripts/public-purpose-smoke.mjs
          fi

          node scripts/account-operability-smoke.mjs
          node scripts/ritual-telemetry-smoke.mjs
          node scripts/telemetry-environment-smoke.mjs
          node scripts/creator-interest-smoke.mjs
          node scripts/creator-os-contract-smoke.mjs
          node scripts/revenue-engine-contract-smoke.mjs
          node scripts/demand-marketplace-contract-smoke.mjs

      - name: Upload redesign visual proof
        if: always() && github.head_ref == 'design/platform-experience-reinvention-v1'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mara-platform-exact-build-visual-proof-${{ github.event.pull_request.head.sha }}
          path: web/artifacts/design-preview
          if-no-files-found: error
          retention-days: 7

      - name: Upload full product responsive proof
        if: always() && github.head_ref == 'codex/full-product-realization-v1'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mara-full-product-responsive-proof-${{ github.event.pull_request.head.sha }}
          path: web/artifacts/full-product-realization
          if-no-files-found: error
          retention-days: 7
