name: Web Launch CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-launch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify DEV labs are blocked in production
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do
            if ! grep -q 'process.env.NODE_ENV !== "development"' "$file" || ! grep -q 'notFound' "$file"; then
              echo "Unsafe production lab route: $file"
              failed=1
            fi
          done < <(find app/experience -type f -path '*-lab/page.tsx' | sort)
          test "$failed" -eq 0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
