name: Mara Hosted Current QA

on:
  push:
    branches: [qa/hosted-proof-2d7ea95]

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.62.1"
  PRODUCT_SHA: "d17cb69c28e327ed03b60d61c2bfea668c90d79c"
  BASE_URL: "https://mara-vera-proof-588e39f.vercel.app"
  QA_PREPROVISIONED: "1"
  QA_EMAIL_A: "mara.qa.33889776712.1.a@gmail.com"
  QA_EMAIL_B: "mara.qa.33888676417.1.a@gmail.com"

jobs:
  hosted-current-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v7.0.1
        with:
          ref: qa/hosted-proof-2d7ea95

      - name: Preserve QA harness outside worktree
        shell: bash
        run: cp qa/hosted-current-e2e.mjs /tmp/hosted-current-e2e.mjs

      - name: Checkout exact product SHA
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          clean: true

      - name: Verify exact product SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "MARA_HOSTED_QA_PRODUCT_SHA=$PRODUCT_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Generate one-run QA password hashes
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund bcryptjs@2.4.3
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const bcrypt = require('bcryptjs');
          for (const suffix of ['A', 'B']) {
            const password = crypto.randomBytes(24).toString('hex');
            const hash = bcrypt.hashSync(password, 10);
            console.log(`::add-mask::${password}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `QA_PASSWORD_${suffix}=${password}\n`);
            console.log(`MARA_QA_HASH_${suffix}=${hash}`);
          }
          NODE

      - name: Wait for operator-scoped QA hash activation
        shell: bash
        run: |
          set -euo pipefail
          login_status() {
            local email="$1"
            local password="$2"
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST "$BASE_URL/api/auth/signin" \
              --header 'Content-Type: application/json' \
              --data "$(jq -cn --arg email "$email" --arg password "$password" '{email:$email,password:$password}')"
          }
          for attempt in $(seq 1 60); do
            status_a="$(login_status "$QA_EMAIL_A" "$QA_PASSWORD_A")"
            status_b="$(login_status "$QA_EMAIL_B" "$QA_PASSWORD_B")"
            if [ "$status_a" = "200" ] && [ "$status_b" = "200" ]; then
              echo "MARA_QA_AUTH_FIXTURES_READY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::QA password hashes were not activated for both isolated fixtures"
          exit 1

      - name: Install Chromium runtime
        working-directory: web
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Restore QA harness inside package scope
        shell: bash
        run: cp /tmp/hosted-current-e2e.mjs web/.hosted-current-e2e.mjs

      - name: Run hosted Browser A/B + isolation proof
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          node .hosted-current-e2e.mjs

      - name: Upload clean Browser B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mara-hosted-browser-b-${{ github.run_id }}
          path: web/browser-b-memory.png
          if-no-files-found: ignore
          retention-days: 7

      - name: State proof boundary
        if: always()
        shell: bash
        run: |
          echo "MARA_HOSTED_QA_BASE=$BASE_URL"
          echo "MARA_HOSTED_QA_PRODUCT_SHA=$PRODUCT_SHA"
          echo "MARA_QA_FIXTURES=recycled-isolated-accounts"
          echo "CANONICAL_PRODUCTION_UNTOUCHED=https://mara-vera.vercel.app"

# QA branch only. Runs exact product SHA against the isolated Vercel host.
# Two old QA-only Auth identities are recycled with fresh one-run bcrypt passwords.
# Only password hashes are surfaced to the operator; plaintext remains masked in Actions.
# The operator cleans private QA state before the run and removes fixtures afterward.
# No service-role key leaves Supabase. No merge, canonical production mutation, or payment activation.
