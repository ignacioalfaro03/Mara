name: Mara Hosted Current QA

on:
  push:
    branches: [qa/hosted-proof-2d7ea95]

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.62.1"
  PRODUCT_SHA: "d17cb69c28e327ed03b60d61c2bfea668c90d79c"
  BASE_URL: "https://mara-vera-proof-588e39f.vercel.app"
  QA_PREPROVISIONED: "0"

jobs:
  hosted-current-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v7.0.1
        with:
          ref: qa/hosted-proof-2d7ea95

      - name: Preserve QA harness outside worktree
        shell: bash
        run: cp qa/hosted-current-e2e.mjs /tmp/hosted-current-e2e.mjs

      - name: Generate ephemeral QA credentials
        shell: bash
        run: |
          set -euo pipefail
          QA_EMAIL_A="mara.qa.signup.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.a@example.com"
          QA_EMAIL_B="mara.qa.signup.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.b@example.com"
          QA_PASSWORD_A="$(openssl rand -hex 24)"
          QA_PASSWORD_B="$(openssl rand -hex 24)"
          echo "::add-mask::$QA_PASSWORD_A"
          echo "::add-mask::$QA_PASSWORD_B"
          echo "QA_EMAIL_A=$QA_EMAIL_A" >> "$GITHUB_ENV"
          echo "QA_EMAIL_B=$QA_EMAIL_B" >> "$GITHUB_ENV"
          echo "QA_PASSWORD_A=$QA_PASSWORD_A" >> "$GITHUB_ENV"
          echo "QA_PASSWORD_B=$QA_PASSWORD_B" >> "$GITHUB_ENV"
          echo "MARA_QA_CREDENTIALS_READY"

      - name: Checkout exact product SHA
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PRODUCT_SHA }}
          clean: true

      - name: Verify exact product SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "MARA_HOSTED_QA_PRODUCT_SHA=$PRODUCT_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install Chromium runtime
        working-directory: web
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Restore QA harness inside package scope
        shell: bash
        run: cp /tmp/hosted-current-e2e.mjs web/.hosted-current-e2e.mjs

      - name: Run hosted Browser A/B + isolation proof
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          node .hosted-current-e2e.mjs

      - name: Upload clean Browser B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mara-hosted-browser-b-${{ github.run_id }}
          path: web/browser-b-memory.png
          if-no-files-found: ignore
          retention-days: 7

      - name: State proof boundary
        if: always()
        shell: bash
        run: |
          echo "MARA_HOSTED_QA_BASE=$BASE_URL"
          echo "MARA_HOSTED_QA_PRODUCT_SHA=$PRODUCT_SHA"
          echo "MARA_QA_FIXTURES_PREFIX=mara.qa.signup.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}."
          echo "CANONICAL_PRODUCTION_UNTOUCHED=https://mara-vera.vercel.app"

# QA branch only. Runs the exact product SHA against the isolated Vercel host.
# The browser creates ordinary Auth signups with example.com QA identities.
# Confirmation and cleanup are operator-scoped to this exact GitHub run prefix.
# No service-role key leaves Supabase. No merge, canonical production mutation, or payment activation.
