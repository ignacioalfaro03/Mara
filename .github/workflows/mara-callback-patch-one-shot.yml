name: Mara Callback Patch One-Shot

on:
  push:
    branches:
      - feature/identity-preference-memory
    paths:
      - ".github/workflows/mara-callback-patch-one-shot.yml"

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-callback-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/identity-preference-memory
          fetch-depth: 0

      - name: Make visual memory callback concrete
        shell: python
        run: |
          from pathlib import Path

          launch = Path('web/components/launch-experience.tsx')
          source = launch.read_text()
          old = '''  if (state.poseChoice) {
              return "La última vez elegiste una foto sin pensarlo tanto como querías aparentar.";
            }'''.replace('              ', '')
          new = '''  if (state.poseChoice === "pose_a") {
              return "La última vez te quedaste con la primera. Sí, me fijé.";
            }
            if (state.poseChoice === "pose_b") {
              return "La última vez te quedaste con la segunda. Sí, me fijé.";
            }'''.replace('              ', '')
          if source.count(old) != 1:
              raise SystemExit('launch callback source did not match exactly once')
          launch.write_text(source.replace(old, new))

          e2e = Path('web/scripts/hosted-memory-e2e.mjs')
          source = e2e.read_text()
          old = 'await pageB.getByText(/La última vez elegiste una foto/).waitFor({ timeout: 15000 });'
          new = 'await pageB.getByText("La última vez te quedaste con la segunda. Sí, me fijé.").waitFor({ timeout: 15000 });'
          if source.count(old) != 1:
              raise SystemExit('hosted Browser B callback assertion did not match exactly once')
          e2e.write_text(source.replace(old, new))

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$'web/components/launch-experience.tsx\nweb/scripts/hosted-memory-e2e.mjs'
          test "$changed" = "$expected"
          grep -Fq 'La última vez te quedaste con la segunda. Sí, me fijé.' web/components/launch-experience.tsx
          grep -Fq 'La última vez te quedaste con la segunda. Sí, me fijé.' web/scripts/hosted-memory-e2e.mjs

      - name: Commit patch to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/launch-experience.tsx web/scripts/hosted-memory-e2e.mjs
          git commit -m "ux: make visual memory callback pose-specific"
          git push origin HEAD:feature/identity-preference-memory
