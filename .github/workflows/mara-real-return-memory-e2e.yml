name: Mara Real Return Memory E2E

on:
  push:
    branches:
      - feature/identity-preference-memory
    paths:
      - ".github/workflows/mara-real-return-memory-e2e.yml"
      - "web/scripts/real-memory-return-e2e.mjs"

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.62.1"
  NEXT_PUBLIC_SUPABASE_URL: "https://hctykprkwenhatbjxkpb.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_VQ-2Db0Di57kA3DEkeml9A_vZMYHDwi"

jobs:
  real-return-memory-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build production app against Mara Supabase
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Wait for ephemeral QA fixture
        shell: bash
        run: |
          echo "MARA_QA_FIXTURE_EMAIL=mara.return.${GITHUB_RUN_ID}@gmail.com"
          echo "MARA_QA_FIXTURE_PASSWORD=MaraReturn-${GITHUB_RUN_ID}-Qa!9x"
          echo "Waiting 90 seconds for the external QA fixture to be seeded."
          sleep 90

      - name: Run real clean-browser return and stale-state E2E
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BASE_URL: "http://127.0.0.1:3000"
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/mara-real-return.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/api/health-memory" > /tmp/memory-health.json; then
              break
            fi
            sleep 1
          done
          export QA_EMAIL="mara.return.${GITHUB_RUN_ID}@gmail.com"
          export QA_PASSWORD="MaraReturn-${GITHUB_RUN_ID}-Qa!9x"
          node scripts/real-memory-return-e2e.mjs

      - name: Preserve activation boundary
        if: always()
        run: |
          echo "PRODUCTION_ALIAS_UNTOUCHED=https://mara-vera.vercel.app"
          echo "NO_MERGE_EXECUTED=true"

# Test-only fixture is externally seeded, contains no real user data, and must be deleted after the run.
