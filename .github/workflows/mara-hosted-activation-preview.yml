name: Mara Hosted Activation Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: "59.11.1"
  PLAYWRIGHT_VERSION: "1.62.1"
  VERCEL_ORG_ID: "team_KAPFjrSQT78GUeQyGZCdQRdz"
  VERCEL_PROJECT_ID: "prj_47YN2RH1i1NvaRTuEVqqbA8cdxUK"
  VERCEL_SCOPE: "ignacioalfaz-6766"

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'codex/launch-execution-control' || github.event.pull_request.head.ref == 'feature/world-sofi-first-slice' || github.event.pull_request.head.ref == 'release/public-alpha-rc'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Upload exact web source snapshot
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mara-web-source-${{ github.event.pull_request.head.sha }}
          path: web
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

      - name: Check Preview deploy credential
        id: preflight
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "MARA_PREVIEW_DEPLOY_READY=true"
          else
            echo "::notice::Preview deploy blocked: missing GitHub Secret VERCEL_TOKEN"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "MARA_PREVIEW_DEPLOY_BLOCKED=missing_vercel_token"
          fi

      - name: Verify exact PR head
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "MARA_PREVIEW_SHA=${{ github.event.pull_request.head.sha }}"

      - name: Setup Node
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        if: steps.preflight.outputs.ready == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        if: steps.preflight.outputs.ready == 'true'
        working-directory: web
        run: node scripts/npm-audit-gate.mjs

      - name: Typecheck candidate
        if: steps.preflight.outputs.ready == 'true'
        working-directory: web
        run: npm run typecheck

      - name: Install Vercel CLI
        if: steps.preflight.outputs.ready == 'true'
        working-directory: web
        run: npm install --no-save --no-package-lock --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Preview environment and verify project link
        if: steps.preflight.outputs.ready == 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync(
            '.vercel/project.json',
            JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
            }),
          );
          NODE
          npx vercel pull --yes --environment=preview --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          node <<'NODE'
          const fs = require('fs');
          const linked = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (linked.projectId !== process.env.VERCEL_PROJECT_ID) {
            throw new Error(`Vercel project mismatch: ${linked.projectId}`);
          }
          if (linked.orgId !== process.env.VERCEL_ORG_ID) {
            throw new Error(`Vercel org mismatch: ${linked.orgId}`);
          }
          console.log('MARA_VERCEL_PREVIEW_LINK PASS');
          NODE

      - name: Build Preview candidate
        if: steps.preflight.outputs.ready == 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx vercel build --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy exact PR head to Vercel Preview
        if: steps.preflight.outputs.ready == 'true'
        id: deploy
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx vercel deploy --prebuilt --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/mara-preview-deploy.log
          deployment_url=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/mara-preview-deploy.log | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "::error::Vercel CLI did not return a Preview URL"
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "MARA_PREVIEW_URL=$deployment_url"

      - name: Wait for Preview READY
        if: steps.preflight.outputs.ready == 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: npx vercel inspect "$DEPLOYMENT_URL" --wait --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Prove hosted telemetry persistence
        if: steps.preflight.outputs.ready == 'true'
        working-directory: web
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/hosted-telemetry-persistence-smoke.mjs

      - name: Install hosted browser proof runtime
        if: steps.preflight.outputs.ready == 'true' && (github.event.pull_request.head.ref == 'feature/world-sofi-first-slice' || github.event.pull_request.head.ref == 'release/public-alpha-rc')
        working-directory: web
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Prove World P0 on hosted Preview
        if: steps.preflight.outputs.ready == 'true' && (github.event.pull_request.head.ref == 'feature/world-sofi-first-slice' || github.event.pull_request.head.ref == 'release/public-alpha-rc')
        working-directory: web
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/world-sofi-smoke.mjs

      - name: Publish Preview proof boundary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.preflight.outputs.ready }}" = "true" ]; then
            echo "MARA_HOSTED_PREVIEW_CREATED=${{ steps.deploy.outputs.deployment_url }}"
            echo "MARA_HOSTED_PREVIEW_SHA=${{ github.event.pull_request.head.sha }}"
            echo "PRODUCTION_ALIAS_UNTOUCHED=https://mara-vera.vercel.app"
          else
            echo "MARA_HOSTED_PREVIEW_BLOCKED=Add only VERCEL_TOKEN as a GitHub Actions secret, then rerun this job."
            echo "VERCEL_ORG_ID=$VERCEL_ORG_ID"
            echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID"
            echo "PRODUCTION_ALIAS_UNTOUCHED=https://mara-vera.vercel.app"
          fi

# Preview only. No --prod, no production alias movement, no payment activation.
