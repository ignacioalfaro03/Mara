name: Mara Creator Alpha Commercial E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "web/**"
      - ".github/workflows/mara-creator-alpha-commercial-e2e.yml"

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: "59.11.1"
  PLAYWRIGHT_VERSION: "1.62.1"
  VERCEL_ORG_ID: "team_KAPFjrSQT78GUeQyGZCdQRdz"
  VERCEL_SCOPE: "ignacioalfaz-6766"
  MARA_PROOF_VERCEL_PROJECT_ID: "prj_AFQlC5fN2qKwrfZ8q7VzF9PnzAHc"
  VERCEL_PROJECT_ID: "prj_AFQlC5fN2qKwrfZ8q7VzF9PnzAHc"
  NEXT_PUBLIC_SUPABASE_URL: "https://hctykprkwenhatbjxkpb.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_VQ-2Db0Di57kA3DEkeml9A_vZMYHDwi"

jobs:
  creator-alpha-browser-e2e:
    if: github.event.pull_request.head.ref == 'release/mara-creator-alpha-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact release SHA and isolated target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$VERCEL_PROJECT_ID" = "$MARA_PROOF_VERCEL_PROJECT_ID"
          test "$VERCEL_PROJECT_ID" != "prj_47YN2RH1i1NvaRTuEVqqbA8cdxUK"
          echo "MARA_CREATOR_ALPHA_RELEASE_SHA=${{ github.event.pull_request.head.sha }}"
          echo "MARA_CREATOR_ALPHA_TARGET=isolated-proof"

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck candidate
        working-directory: web
        run: npm run typecheck

      - name: Install hosted proof tooling
        working-directory: web
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}" "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Link isolated proof project
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_PROJECT_ID" = "$MARA_PROOF_VERCEL_PROJECT_ID"
          rm -rf .vercel
          mkdir -p .vercel
          node <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(
            ".vercel/project.json",
            JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
            }),
          );
          NODE
          npx vercel pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

          node <<'NODE'
          const fs = require("fs");
          const linked = JSON.parse(fs.readFileSync(".vercel/project.json", "utf8"));
          if (linked.projectId !== process.env.MARA_PROOF_VERCEL_PROJECT_ID) {
            throw new Error(`Unsafe Vercel project target: ${linked.projectId}`);
          }
          if (linked.orgId !== process.env.VERCEL_ORG_ID) {
            throw new Error(`Unsafe Vercel org target: ${linked.orgId}`);
          }
          console.log("MARA_CREATOR_ALPHA_ISOLATED_PROJECT PASS");
          NODE

      - name: Deploy exact SHA to isolated proof production slot
        id: deploy
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          test "$VERCEL_PROJECT_ID" = "$MARA_PROOF_VERCEL_PROJECT_ID"
          test "$VERCEL_PROJECT_ID" != "prj_47YN2RH1i1NvaRTuEVqqbA8cdxUK"

          payment_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$payment_secret"

          npx vercel deploy --prod --skip-domain --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --env "MARA_RELEASE_SHA=${{ github.event.pull_request.head.sha }}" \
            --env "MARA_QA_PROOF_TOKEN=$VERCEL_AUTOMATION_BYPASS_SECRET" \
            --env "MARA_ALPHA_CREATOR_ONBOARDING_ENABLED=true" \
            --env "MARA_PAYMENT_PROVIDER=signed_test" \
            --env "MARA_PAYMENT_WEBHOOK_SECRET=$payment_secret" \
            --env "MARA_SIGNED_TEST_PROOF=true" \
            --meta "githubCommitSha=${{ github.event.pull_request.head.sha }}" \
            2>&1 | tee /tmp/mara-creator-alpha-deploy.log

          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/mara-creator-alpha-deploy.log | tail -n 1)"
          test -n "$deployment_url"
          case "$deployment_url" in
            https://mara-vera-proof-588e39f-*.vercel.app) ;;
            *) echo "::error::Unsafe hosted target: $deployment_url"; exit 1 ;;
          esac
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "MARA_CREATOR_ALPHA_HOSTED_URL=$deployment_url"

      - name: Wait for isolated deployment READY
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: npx vercel inspect "$DEPLOYMENT_URL" --wait --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Prove creator pilot intake through hosted UI
        working-directory: web
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hosted-creator-interest-e2e.mjs

      - name: Run Creator Alpha browser/session commercial loop
        working-directory: web
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          QA_BOOTSTRAP_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hosted-creator-alpha-e2e.mjs

      - name: Upload Creator Alpha acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mara-creator-alpha-e2e-${{ github.event.pull_request.head.sha }}
          path: web/artifacts/creator-alpha-e2e
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Publish proof boundary
        if: always()
        shell: bash
        run: |
          echo "MARA_CREATOR_ALPHA_PROOF_SHA=${{ github.event.pull_request.head.sha }}"
          echo "MARA_CREATOR_ALPHA_PROOF_KIND=isolated-production-slot-skip-domain-signed-test"
          echo "MARA_CREATOR_ALPHA_REAL_MONEY=false"
          echo "MARA_CREATOR_ALPHA_PAYOUTS=false"
          echo "CANONICAL_PRODUCTION_ALIAS_UNTOUCHED=https://mara-vera.vercel.app"
