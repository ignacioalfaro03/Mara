name: Mara Final Canonical Validation

on:
  push:
    branches:
      - ops/public-alpha-final-cutover-20260905
    paths:
      - ".github/workflows/mara-final-canonical-validation.yml"

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.62.1"
  MARA_MAIN_SHA: "27f10dea80298cc6524d880f0b3465f7a88a13bd"
  CANONICAL_URL: "https://mara-vera.vercel.app"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout exact merged main snapshot
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.MARA_MAIN_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify canonical health after alias propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$CANONICAL_URL/api/health")
            memory_code=$(curl -sS -o /tmp/memory.json -w '%{http_code}' "$CANONICAL_URL/api/health-memory")
            if [ "$health_code" = "200" ] && [ "$memory_code" = "200" ]; then break; fi
            sleep 2
          done
          test "$health_code" = "200"
          test "$memory_code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const memory=JSON.parse(fs.readFileSync('/tmp/memory.json','utf8'));
          if (health?.status !== 'ok' || health?.service !== 'mara-vera-web' || health?.release !== 'public-alpha') throw new Error(`health failed: ${JSON.stringify(health)}`);
          if (memory?.service !== 'mara-identity-memory' || memory?.configured !== true) throw new Error(`memory failed: ${JSON.stringify(memory)}`);
          console.log('MARA_CANONICAL_HEALTH PASS');
          console.log('MARA_CANONICAL_MEMORY_CONFIG PASS');
          NODE

      - name: Measure canonical telemetry persistence
        shell: bash
        run: |
          set -euo pipefail
          session_id=$(node -e "console.log(require('node:crypto').randomUUID())")
          timestamp=$(node -e "console.log(new Date().toISOString())")
          payload=$(jq -cn --arg sid "$session_id" --arg ts "$timestamp" '{event:"page_view",properties:{surface:"/qa-production-cutover",entry_source:"direct"},timestamp:$ts,sessionId:$sid}')
          code=$(curl -sS -o /tmp/telemetry.json -w '%{http_code}' -X POST "$CANONICAL_URL/api/telemetry" -H 'Content-Type: application/json' --data "$payload")
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/telemetry.json','utf8'));
          if (body?.ok !== true) throw new Error(`telemetry endpoint unhealthy: ${JSON.stringify(body)}`);
          console.log(`MARA_CANONICAL_TELEMETRY persisted=${body?.persisted===true?'true':'false'}`);
          NODE

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Run production mobile smoke
        env:
          BASE_URL: ${{ env.CANONICAL_URL }}
        run: node scripts/launch-smoke.mjs

      - name: Run production World/Sofi smoke
        env:
          BASE_URL: ${{ env.CANONICAL_URL }}
        run: node scripts/world-sofi-smoke.mjs

      - name: Prove QA route inert
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$CANONICAL_URL/api/internal/qa-user")
          test "$code" = "404"
          echo "MARA_PRODUCTION_QA_ROUTE_INERT PASS"

      - name: Publish final validation evidence
        shell: bash
        run: |
          echo "VERIFIED_MAIN_SHA=$MARA_MAIN_SHA"
          echo "CANONICAL_ALIAS=$CANONICAL_URL"
          echo "MARA_CANONICAL_NON_TELEMETRY_GATES PASS"
