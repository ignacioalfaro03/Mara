name: Generate Web Lockfile

on:
  push:
    branches:
      - web/mvp-owned-funnel
    paths:
      - ".github/workflows/generate-web-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: contains(github.event.head_commit.message, '[lockfile]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: web/mvp-owned-funnel

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate package-lock
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install from generated lock
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit exact generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- web/package-lock.json && git ls-files --error-unmatch web/package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already committed and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "build(web): lock npm dependency graph"
          git push origin HEAD:web/mvp-owned-funnel
