name: Generate Web Lockfile

on:
  push:
    branches:
      - web/mvp-owned-funnel
    paths:
      - ".github/workflows/generate-web-lockfile.yml"

permissions:
  contents: read

jobs:
  lockfile:
    if: contains(github.event.head_commit.message, '[lockfile]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate package-lock
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install from generated lock
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload package-lock
        uses: actions/upload-artifact@v4
        with:
          name: mara-web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 1
